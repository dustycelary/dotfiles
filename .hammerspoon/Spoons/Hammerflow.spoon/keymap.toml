#################################################
# Hammerflow keymap — restructured for speed
# Frequent actions at root (1 keypress),
# groups for related but less frequent actions.
#################################################

# settings
leader_key = "f18"        # the leader key that starts the sequence
leader_key_mods = ""      # supports cmd ctrl alt shift
auto_reload = true        # reload when any file in this directory is saved
toast_on_reload = true    # show a toast when the config is reloaded
show_ui = true            # show the ui with your key maps
key_maps_per_line = 3     # number of key maps per line in the ui

# ══════════════════════════════════════════════
# ROOT — single keypress, highest frequency
# ══════════════════════════════════════════════
'.' = ["repeat", " repeat"]
c = ["function:openAlfredClipboard", " clipboard"]
j = ["https://gemini.google.com", " gemini"]
b = ["Safari", " safari"]
g = ["hs:hs.urlevent.openURL('kmtrigger://macro=open_in_ghostty')", " ghostty"]
q = ['cmd:open -na Ghostty --args --quit-after-last-window-closed=true --command="/opt/homebrew/bin/nvim /Users/fungus/Documents/Notes/QuickNote/scratch.md"', " scratch.md"]
m = ["cmd:osascript -e 'tell application id \"com.runningwithcrayons.Alfred\" to search \"m \"'", " Menu Search"]
o = ["hs:hs.urlevent.openURL('kmtrigger://macro=ocr_clipboard')", " ocr"]
n = ["hs:hs.urlevent.openURL('kmtrigger://macro=open_in_nvim')", " nvim"]
T = ["cmd:pgrep -x Tailscale > /dev/null && (osascript -e 'quit app \"Tailscale\"' && osascript -e 'display notification \"Tailscale quit\" with title \"Tailscale\"') || (open -a Tailscale && osascript -e 'display notification \"Tailscale launched\" with title \"Tailscale\"')", " tailscale"]


# ══════════════════════════════════════════════
# [f] — files & finder
# ══════════════════════════════════════════════
[f]
label = "|  finder"
f = "Finder"
d = ["cmd:open ~/Downloads", "downloads"]
k = ["cmd:open ~/Desktop", "desktop"]
r = ["cmd:open '/Users/fungus/Library/Saved Searches/Recent.savedSearch'", "recents"]
o = ["cmd:open ~/OneDrive", "onedrive"]
h = ["cmd:open ~/", "fungus"]
D = ["cmd:open /Users/fungus/Library/CloudStorage/OneDrive-Personal/Documents/admin/dopamine_menu_v1.pdf", "Dopa menu"]
c = ["cmd:osascript -e 'tell application id \"com.runningwithcrayons.Alfred\" to search \"cs \"'", "Cheatsheets"]
m = ["cmd:open ~/Documents", "main (docs)"]


# ══════════════════════════════════════════════
# [w] — windows (vim spatial: hjkl halves, HJKL quads)
# ══════════════════════════════════════════════
[w]
label = "|  window"
h = ["window:left-half", "← half"]
l = ["window:right-half", "→ half"]
k = ["window:top-half", "↑ half"]
j = ["window:bottom-half", "↓ half"]
H = ["window:top-left", "↖ quad"]
L = ["window:bottom-right", "↘ quad"]
K = ["window:top-right", "↗ quad"]
J = ["window:bottom-left", "↙ quad"]
f = ["window:fullscreen", "fullscreen"]
c = ["window:center-half", "center"]
x = ["window:maximized", "maximize"]
t = ["menu:View>Float on Top", "float on top"]
s = ["hs:hs.pasteboard.setContents(hs.inspect(hs.window.focusedWindow():size()))", "copy size"]


# ══════════════════════════════════════════════
# [s] — screenshots & shelf (trimmed)
# ══════════════════════════════════════════════
[s]
label = "|  screen/shelf"
m = ["hs:hs.urlevent.openURL('kmtrigger://macro=move_reminder')", "Move reminders"]
k = ["hs:hs.urlevent.openURL('kmtrigger://macro=search_km')", "Search KM"]
A = ["hs:hs.urlevent.openURL('kmtrigger://macro=screenshot_all_monitors')", "ss all monitors"]
w = ["hs:hs.urlevent.openURL('kmtrigger://macro=screenshot_window')", "ss window"]
s = ["hs:hs.urlevent.openURL('kmtrigger://macro=search_snippets')", "Search snippets"]
a = ["hs:hs.urlevent.openURL('kmtrigger://macro=add_to_dropover')", "add to dropover"]
p = ['hs:hs.execute("shortcuts run \"Paste files from shelf\"")', "Paste dropover"]


# ══════════════════════════════════════════════
# [a] — app actions (flattened, no sub-nesting)
# ══════════════════════════════════════════════
[a]
label = "|  app actions"
s = ["menu:Safari|Bookmarks>Show Start Page", "safari start"]
n = "menu:Window>Move Tab to New Window"
m = "menu:Window>Merge All Windows"
o = ["cmd: /opt/homebrew/bin/ollama serve > /dev/null 2>&1", "start ollama"]


# ══════════════════════════════════════════════
# [M] — media controls
# ══════════════════════════════════════════════
[M]
label = "|  media"
'space' = ["hs:hs.eventtap.event.newSystemKeyEvent('PLAY', true):post(); hs.eventtap.event.newSystemKeyEvent('PLAY', false):post()", "Play/Pause"]
"n" = ["hs:hs.eventtap.event.newSystemKeyEvent('NEXT', true):post(); hs.eventtap.event.newSystemKeyEvent('NEXT', false):post()", "Next Track"]
"p" = ["hs:hs.eventtap.event.newSystemKeyEvent('PREVIOUS', true):post(); hs.eventtap.event.newSystemKeyEvent('PREVIOUS', false):post()", "Previous Track"]
