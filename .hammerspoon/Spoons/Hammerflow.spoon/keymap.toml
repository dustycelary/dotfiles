#################################################
# This file is a sample of some things you 
# can do with this leader key setup. It's active
# right now! Set leader_key below and try it! The 
# lua prioritizes home.toml, then work.toml,
# then falls back to this sample.toml. If you
# want different profile names, you can add it
# to the list in ~/.hammerspoon/init.lua. 
#################################################

# settings
leader_key = "f18"        # required, the leader key that starts the sequence
leader_key_mods = ""      # optional, default "", not recommended - a dedicated leader key is better
                             # supports cmd ctrl alt shift
auto_reload = true        # optional, default true, reload when any file in this directory is saved
toast_on_reload = true    # optional, default false, show a toast when the config is reloaded
show_ui = true            # optional, default true, show the ui with your key maps
key_maps_per_line = 1     # optional, default 5, number of key maps per line in the ui

'.' = ["repeat", "   repeat"]
b = ["Safari", "   safari"]
g = ["Ghostty", "   ghostty"]
j = ["Jellyfin Media Player", "   jellyfin"]
c = ["ChatGPT", "   chatgpt"]
r = ["Reminders", "   reminders"]
n = ["Notes", "   notes"]
'space' = ["cmd:osascript -e 'tell application id \"com.runningwithcrayons.Alfred\" to search \"m \"'", " Menu Search"]
# h = ["hs:local w = hs.window.focusedWindow(); if w then local t = w:application():name() .. ': ' .. w:title(); hs.pasteboard.setContents(t); hs.alert('Copied: ' .. t) else hs.alert('No focused window') end", " copy app + window"]
# c = ["function:openAlfredClipboard", "   clipboard"]
# j = ["https://gemini.google.com", "   new gemini tab"]


[f] # FINDER 
label = "|  files"
f = "Finder"
d = ["cmd:open ~/Downloads", "downloads"]
k = ["cmd:open ~/Desktop", "desktop"]
r = ["cmd:open '/Users/fungus/Library/Saved Searches/Recent.savedSearch'", "recents"]
o = ["cmd:open ~/OneDrive", "onedrive"]
h = ["cmd:open ~/", "fungus"]
D = ["cmd:open /Users/fungus/Library/CloudStorage/OneDrive-Personal/Documents/admin/dopamine_menu_v1.pdf", "Dopa menu"]
c = ["cmd:osascript -e 'tell application id \"com.runningwithcrayons.Alfred\" to search \"cs \"'", "Cheatsheets"]
m = ["cmd:open ~/Documents", "main (docs)"]
p = ["cmd:open ~/Developer", "developer"]
# ~/.hammerspoon/home.toml


[m]
label =  "|  macros"
g = ["hs:hs.urlevent.openURL('kmtrigger://macro=open_in_ghostty')", "Open ghostty"]
m = ["hs:hs.urlevent.openURL('kmtrigger://macro=move_reminder')", "Move reminders"]
k = ["hs:hs.urlevent.openURL('kmtrigger://macro=search_km')", "Search KM"]
s = ["hs:hs.urlevent.openURL('kmtrigger://macro=search_snippets')", "Search snippets"]
o = ["hs:hs.urlevent.openURL('kmtrigger://macro=ocr_clipboard')", "Ocr clipboard"]
A = ["hs:hs.urlevent.openURL('kmtrigger://macro=screenshot_all_monitors')", "ss all monitors"]
a = ["hs:hs.urlevent.openURL('kmtrigger://macro=add_to_dropover')", "add to dropover"]
n = ["hs:hs.urlevent.openURL('kmtrigger://macro=open_in_nvim')", "Open in nvim"]
q = ['cmd:open -na Ghostty --args --quit-after-last-window-closed=true --command="/opt/homebrew/bin/nvim /Users/fungus/Documents/Notes/QuickNote/scratch.md"', "nvim scratch.md"]


[p]
label = "|  playback"
'space' = ["hs:hs.eventtap.event.newSystemKeyEvent('PLAY', true):post(); hs.eventtap.event.newSystemKeyEvent('PLAY', false):post()", "Play/Pause"]
"n" = ["hs:hs.eventtap.event.newSystemKeyEvent('NEXT', true):post(); hs.eventtap.event.newSystemKeyEvent('NEXT', false):post()", "Next Track"]
"p" = ["hs:hs.eventtap.event.newSystemKeyEvent('PREVIOUS', true):post(); hs.eventtap.event.newSystemKeyEvent('PREVIOUS', false):post()", "Previous Track"]


[a] 
label = "|  app actions"
# [a.s]
# label = "|  safari"
s = ["menu:Safari|Bookmarks>Show Start Page", "Start page"] # select menu items (specific app)
n = "menu:Window>Move Tab to New Window"    # select menu items (frontmost app)
m = "menu:Window>Merge All Windows"    # select menu items (frontmost app)


# window management
[w]
label = "|  window"
# Arrange the focused window alongside another window using macOS tiling.
h = ["menu:Window>Move & Resize>Left & Right", "arrange left & right"]
l = ["menu:Window>Move & Resize>Right & Left", "arrange right & left"]
k = ["menu:Window>Move & Resize>Top & Bottom", "arrange top & bottom"]
j = ["menu:Window>Move & Resize>Bottom & Top", "arrange bottom & top"]
c = ["window:center-half", "center half"]
f = ["window:fullscreen", "fullscreen"]
x = ["window:maximized", "maximize"]
e = ["window:.05,.05,.9,.9", "almost maximize (90%)"]
r = ["window:.1,.1,.8,.8", "centered (80%)"]
d = ["hs:local w = hs.window.focusedWindow(); if w then w:moveToScreen(w:screen():next()) end", "move to next display"]
o = ["menu:View>Float on Top", "float on top (app menu)"]
s = ["hs:local w = hs.window.focusedWindow(); if w then hs.pasteboard.setContents(hs.inspect(w:size())) end", "copy window size"]
u = ["hs:hs.urlevent.openURL('kmtrigger://macro=unminimize_back_window')", "unminimise"]
1 = ["hs:hs.urlevent.openURL('kmtrigger://macro=window_to_screen_1')", "screen to window 1"]
2 = ["hs:hs.urlevent.openURL('kmtrigger://macro=window_to_screen_2')", "screen to window 2"]
3 = ["hs:hs.urlevent.openURL('kmtrigger://macro=window_to_screen_3')", "screen to window 3"]

# Thirds, plus the useful two-thirds layouts for a main/side window split.
[w.t]
label = "|  thirds"
h = ["window:left-third", "left third"]
c = ["window:center-third", "center third"]
l = ["window:right-third", "right third"]
a = ["window:0,0,.6667,1", "left two-thirds"]
d = ["window:.3333,0,.6667,1", "right two-thirds"]

# Number keys create four vertical columns; letter keys create screen corners.
[w.q]
label = "|  quarters"
'1' = ["window:first-quarter", "first vertical quarter"]
'2' = ["window:second-quarter", "second vertical quarter"]
'3' = ["window:third-quarter", "third vertical quarter"]
'4' = ["window:fourth-quarter", "fourth vertical quarter"]
u = ["window:top-left", "top-left quarter"]
i = ["window:top-right", "top-right quarter"]
j = ["window:bottom-left", "bottom-left quarter"]
k = ["window:bottom-right", "bottom-right quarter"]



