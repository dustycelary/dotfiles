#################################################
# This file is a sample of some things you 
# can do with this leader key setup. It's active
# right now! Set leader_key below and try it! The 
# lua prioritizes home.toml, then work.toml,
# then falls back to this sample.toml. If you
# want different profile names, you can add it
# to the list in ~/.hammerspoon/init.lua. 
#################################################

# settings
leader_key = "§"        # required, the leader key that starts the sequence
leader_key_mods = ""      # optional, default "", not recommended - a dedicated leader key is better
                             # supports cmd ctrl alt shift
auto_reload = true        # optional, default true, reload when any file in this directory is saved
toast_on_reload = true    # optional, default false, show a toast when the config is reloaded
show_ui = true            # optional, default true, show the ui with your key maps
key_maps_per_line = 1     # optional, default 5, number of key maps per line in the ui

g = ["Ghostty", " ghostty"]
'.' = ["repeat", " repeat"]
c = ["function:openAlfredClipboard", " clipboard"]
b = ["cmd:osascript -e 'tell application id \"com.runningwithcrayons.Alfred\" to search \"m \"'", " Menu Search"]
s = ["hs:hs.window.focusedWindow():move({x=550,y=220,w=820,h=520})", " shrink window"]
v = ["function:showResourceViewer", " resource viewer"]
# p = ["function:launchAppMonitor", " compact terminal monitor (400x400)"]
p = ["hs:resourceMonitor.toggle()", " resource monitor"]


[f] # FINDER 
label = "|  finder"
f = "Finder"
d = ["cmd:open ~/Downloads", "downloads"]
k = ["cmd:open ~/Desktop", "desktop"]
r = ["cmd:open '/Users/fungus/Library/Saved Searches/Recent.savedSearch'", "recents"]
o = ["cmd:open ~/OneDrive", "onedrive"]
h = ["cmd:open ~/", "fungus"]
# ~/.hammerspoon/home.toml


[k]
label = "|  maestro"
g = ["hs:hs.urlevent.openURL('kmtrigger://macro=open_in_ghostty')", "Open ghostty"]
m = ["hs:hs.urlevent.openURL('kmtrigger://macro=move_reminder')", "Move reminders"]
k = ["hs:hs.urlevent.openURL('kmtrigger://macro=search_km')", "Search KM"]
o = ["hs:hs.urlevent.openURL('kmtrigger://macro=ocr_clipboard')", "Ocr clipboard"]
s = ["hs:hs.urlevent.openURL('kmtrigger://macro=screenshot_all_monitors')", "ss all monitors"]
a = ["hs:hs.urlevent.openURL('kmtrigger://macro=screenshot_active_monitor')", "ss active monitor"]
# o = ["hs:hs.urlevent.openURL('kmtrigger://macro=screenshot_active_monitor')", "ss active monitor"]

# raycast deep links are supported
[r]
label = "|  raycast"
c = ["raycast://extensions/raycast/raycast/confetti", "confetti"]
e = ["raycast://extensions/raycast/emoji-symbols/search-emoji-symbols", "emoji"]
v = ["raycast://extensions/jomifepe/bitwarden/search", "Search vault"]
r = ["raycast://root-search", "search raycast"]
n = ["raycast://extensions/raycast/raycast-notes/raycast-notes", "notes"]
a = ["raycast://extensions/raycast/raycast-ai/ai-chat", "Ai chat"]

# [h]
# label = "|  helpers"

[m]
label = "|  media"
p = ["hs:hs.eventtap.event.newSystemKeyEvent('PLAY', true):post(); hs.eventtap.event.newSystemKeyEvent('PLAY', false):post()", "Play/Pause"]
s = ["hs:hs.spotify.playpause()", "Spotify Play/Pause"]
u = ["hs:hs.audiodevice.defaultOutputDevicesh fungus@fungus-pi.local):setVolume(math.min(100, hs.audiodevice.defaultOutputDevice():volume() + 5))", "Volume Up"]
d = ["hs:hs.audiodevice.defaultOutputDevice():setVolume(math.max(0, hs.audiodevice.defaultOutputDevice():volume() - 5))", "Volume Down"]
m = ["hs:local dev = hs.audiodevice.defaultOutputDevice(); dev:setMuted(not dev:muted())", "Mute/Unmute"]

[a] 
label = "|  apps"
[a.s]
label = "|  safari"
s = ["menu:Safari|Bookmarks>Show Start Page", "Start page"] # select menu items (specific app)
[a.o]
label = "|  ollama"
q = ["cmd: /Users/fungus/Library/CloudStorage/OneDrive-Personal/Documents/tech-bible/automation/scripts/stop-ollama.sh", "quit ollama"]





