# ==============================================================================
# 01. PREFIX KEYS & UTILITIES
# ==============================================================================
# Ctrl+Space and F8 are native tmux prefixes. Alt+F12 also opens the prefix table.

# Primary Prefix: Ctrl + Space
set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# Secondary Prefix: F8
set-option -g prefix2 F8
bind-key F8 send-prefix -2

# Additional one-shot prefix trigger
bind-key -n M-F12 switch-client -T prefix

# Config & Client Utilities
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
bind-key r refresh-client
bind-key L clear-history
bind-key : command-prompt
bind-key \; command-prompt
bind -n M-\; command-prompt
bind -n F2 command-prompt


# ==============================================================================
# 02. GENERAL SETTINGS & TERMINAL FEATURES
# ==============================================================================
set -g default-terminal "tmux-256color"
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g mouse on
set -s set-clipboard on
set -g allow-passthrough on
set-window-option -g display-panes-time 1500
set-option -g repeat-time 1000
set-option -g assume-paste-time 0

# Terminal Overrides & Extended Keys
set-option -sa terminal-features ',xterm-ghostty:RGB'
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",*:Ms=\\E]52;c;%p2%s\\007"
set -as terminal-features ",*:cstyle"
set -as terminal-features ',*:clipboard'
set -as terminal-features ',xterm-ghostty:clipboard'
set -as terminal-features ',xterm-256color:clipboard'


# ==============================================================================
# 03. THEME & COLOR PALETTE (Catppuccin Latte)
# ==============================================================================
set -g @ghostty_bg             "eff1f5"  # Latte Base (Light terminal bg)
set -g @ghostty_fg             "4c4f69"  # Latte Text (Dark text)
set -g @ghostty_surface        "ccd0da"  # Latte Surface 0
set -g @ghostty_status_bg      "4c4f69"  # Latte Text (Dark status bar)
set -g @ghostty_status_fg      "eff1f5"  # Latte Base (Light status text)
set -g @ghostty_border         "bcc0cc"  # Latte Surface 1
set -g @ghostty_blue           "1e66f5"  # Latte Blue
set -g @ghostty_selection_bg   "4c4f69"  # Latte Text (Dark selection bg)
set -g @ghostty_selection_fg   "eff1f5"  # Latte Base (Light selection text)

set -g mode-style "bg=#4c4f69,fg=#eff1f5,bold"
set -g message-style "bg=#4c4f69,fg=#eff1f5,fill=#4c4f69"
set -g message-command-style "bg=#4c4f69,fg=#eff1f5,fill=#4c4f69"
set -g message-format "#[align=left #{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}"
set -g status-style "bg=#4c4f69,fg=#eff1f5"
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#1e66f5"


# ==============================================================================
# 04. STATUS BAR CONFIGURATION
# ==============================================================================
set-option -g status-interval 2
set-option -g status-position bottom
set-option -g status-left " #S   "
set-option -g status-left-length 30
set-option -g status-right "#{?#{==:#{client_key_table},off}, [PASS] ,#{?client_prefix, [PREFIX] ,#{?pane_in_mode, [COPY] ,}}} #(~/.tmux/scripts/agy_monitor.sh) | %H:%M  %d %b"
set-option -g status-right-length 60
setw -g window-status-style         "fg=#ccd0da,bg=#4c4f69"
setw -g window-status-format        " #I #W#{?window_linked,@,} "
setw -g window-status-current-style "fg=#eff1f5,bg=#1e66f5,bold"
setw -g window-status-current-format " #I #W*#{?window_linked,@,}#{?window_zoomed_flag,Z,}#{?#{>:#{window_panes},1},[#{window_panes}],} "
setw -g window-status-separator ""


# ==============================================================================
# 05. COPY MODE & VI BINDINGS
# ==============================================================================

# Use vi keys in copy mode; status-line prompts keep emacs-style editing.
setw -g mode-keys vi
set -g status-keys emacs

# Extra ways to enter copy mode. Prefix+[ is already a tmux default.
bind enter copy-mode
# Ctrl+Alt+C is a mnemonic global shortcut unused by Zsh, Neovim, and AeroSpace.
bind -n C-M-c copy-mode

# Vim-like selection: v starts selecting, Escape leaves copy mode.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel

# Jump backward to the previous command text, or forward to the next prompt.
bind -T copy-mode-vi "{" send -X cursor-left \; \
  send -X cursor-left \; \
  send -X search-backward "\\$ " \; \
  send -X cursor-right \; \
  send -X cursor-right
bind -T copy-mode-vi "}" send -X search-forward "\\$ " \; \
  send -X cursor-right \; \
  send -X cursor-right

# Configure the system clipboard once for every copy-pipe action (tmux 3.2+).
if-shell 'uname | grep -q Darwin' {
  # macOS always provides pbcopy.
  set -s copy-command "pbcopy"
} {
  # Raspberry Pi/Linux: use whichever graphical clipboard tool is available.
  # Over SSH, set-clipboard sends the same copied text to Ghostty using OSC 52.
  set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1; then xsel -i --clipboard; else cat >/dev/null; fi'
}

# y copies the current selection but remains in copy mode.
bind -T copy-mode-vi y send -X copy-pipe

# Prefix+Alt+y copies from cursor back to prompt start, then exits copy mode.
bind M-y copy-mode \; \
  send -X begin-selection \; \
  send -X search-backward "\\$ " \; \
  send -X cursor-right \; \
  send -X cursor-right \; \
  send -X copy-pipe-and-cancel

# Mouse selections copy to the clipboard but remain in copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe

# Prefix+Y selects the previous command's output, copies it, and exits.
bind Y copy-mode \; \
  send -X cursor-up \; \
  send -X end-of-line \; \
  send -X begin-selection \; \
  send -X search-backward "\\$ " \; \
  send -X start-of-line \; \
  send -X copy-pipe-and-cancel

# Enter keeps tmux's default copy-pipe-and-cancel behavior.


# ==============================================================================
# 06. SESSION MANAGEMENT & SWITCHING
# ==============================================================================
bind-key N new-session -c "#{pane_current_path}"



# ==============================================================================
# 07. WINDOW MANAGEMENT & NAVIGATION
# ==============================================================================
# Window Creation & Navigation
bind-key c new-window -c "#{pane_current_path}"
bind -N "New Window" -n M-o new-window -c "#{pane_current_path}"
bind-key -n M-n next-window
bind-key -n M-p previous-window

# ==============================================================================
# 08. PANE MANAGEMENT, NAVIGATION & JOINING
# ==============================================================================
# Pane Creation & Splitting
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key -n M-q display-panes

bind-key -n M-m    new-pane -f -c "#{pane_current_path}" -X 38% -Y 30%                  # Alt + m (Slightly Right & Higher)
bind-key x kill-pane

# Pane Creation & Management (No Prefix / Alt Keys)
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-z resize-pane -Z


# Pane Navigation (Vim-style & Alt Keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane Resizing (Prefix & Alt Keys)
bind -r -N "Resize pane left" C-h resize-pane -L 5
bind -r -N "Resize pane down" C-j resize-pane -D 5
bind -r -N "Resize pane up" C-k resize-pane -U 5
bind -r -N "Resize pane right" C-l resize-pane -R 5

bind-key -N "Break pane -d" @ break-pane -d

# Special 

# Nested Tmux (Passthrough Mode - F12)
bind -n F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#eff1f5,bg=#1e66f5,bold" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S


# ==============================================================================
# 10. LOCAL OVERRIDES
# ==============================================================================
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
