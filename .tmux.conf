# --- [BOTH] ---
# ==============================================================================
# PREFIX KEYS & COPY MODE BINDINGS
# ==============================================================================
# Dual prefixes enabled: Both Ctrl+Space and F8 act as tmux prefix keys.

# Primary Prefix: Ctrl + Space
set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# Secondary Prefix: F8
set-option -g prefix2 F8
bind-key F8 send-prefix -2

# Copy Mode Shortcuts
bind-key Space copy-mode
bind-key -n F3 copy-mode
bind-key F3 copy-mode



# Terminal and Color Settings
# tmux cannot read Ghostty's named theme or selection colours. Keep this block
# in sync with the active theme in ~/.config/ghostty/config, then make every
# tmux-owned UI element below refer to these variables.
#
# Ghostty Carbonfox (retained here so it is easy to switch back):
set -g @ghostty_bg             "#161616"
set -g @ghostty_fg             "#f2f4f8"
set -g @ghostty_surface        "#2a2a2a"
set -g @ghostty_status_bg      "#33b1ff"
set -g @ghostty_status_fg      "#161616"
set -g @ghostty_border         "#484848"
set -g @ghostty_blue           "#78a9ff"
set -g @ghostty_selection_bg   "#2a2a2a"
set -g @ghostty_selection_fg   "#f2f4f8"

set-option -sa terminal-features ',xterm-ghostty:RGB'
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",*:Ms=\\E]52;c;%p2%s\\007"
set -as terminal-features ",*:cstyle"
set -g mode-style "bg=#{@ghostty_selection_bg},fg=#{@ghostty_selection_fg}"
set -g message-style "bg=#{@ghostty_surface},fg=#{@ghostty_fg}"
set -g message-command-style "bg=#{@ghostty_surface},fg=#{@ghostty_fg}"
set -g status-style "bg=#{@ghostty_status_bg},fg=#{@ghostty_status_fg}"
set -g pane-border-style "fg=#{@ghostty_border}"
set -g pane-active-border-style "fg=#{@ghostty_blue}"
set -as terminal-features ',*:clipboard'
set -as terminal-features ',xterm-ghostty:clipboard'
set -as terminal-features ',xterm-256color:clipboard'


# General Settings
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on
set-window-option -g display-panes-time 1500
bind -n M-l select-pane -R
set-window-option -g mode-keys vi
set-option -g repeat-time 1000
set-option -g assume-paste-time 0

# Vi Mode and Copy Mode
set -g mode-keys vi
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key Space copy-mode

if-shell 'uname | grep -q Darwin' {
  # --- [MAC ONLY] ---
  bind-key -T copy-mode-vi "{" send-keys -X search-backward "\\$ "
  bind-key -T copy-mode-vi "}" send-keys -X search-forward "\\$ "
  bind-key -T copy-mode "{" send-keys -X search-backward "\\$ "
  bind-key -T copy-mode "}" send-keys -X search-forward "\\$ "

  # Automatically grab output of last command
  bind-key Y copy-mode \; \
    send-keys -X cursor-up \; \
    send-keys -X end-of-line \; \
    send-keys -X begin-selection \; \
    send-keys -X search-backward "\\$ " \; \
    send-keys -X start-of-line \; \
    send-keys -X copy-pipe-and-cancel "pbcopy"

  bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
  bind-key -T copy-mode y send-keys -X copy-pipe "pbcopy"
  unbind -T copy-mode-vi Enter
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
  unbind -T copy-mode Enter
  bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "pbcopy"

  # Mouse selection (drag, double-click, triple-click)
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

  bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"

  bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"

  bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "pbcopy" }
  bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "pbcopy" }
} {
  # --- [PI/LINUX ONLY] ---
  bind-key -T copy-mode-vi "{" send-keys -X search-backward "\\$ "
  bind-key -T copy-mode-vi "}" send-keys -X search-forward "\\$ "
  bind-key -T copy-mode "{" send-keys -X search-backward "\\$ "
  bind-key -T copy-mode "}" send-keys -X search-forward "\\$ "

  bind-key Y copy-mode \; \
    send-keys -X start-of-line \; \
    send-keys -X begin-selection \; \
    send-keys -X search-backward "\\$ " \; \
    send-keys -X start-of-line \; \
    send-keys -X copy-selection-and-cancel \; \
    run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'

  bind-key -T copy-mode-vi y send-keys -X copy-selection \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'
  bind-key -T copy-mode y send-keys -X copy-selection \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'

  unbind -T copy-mode-vi Enter
  bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'
  unbind -T copy-mode Enter
  bind-key -T copy-mode Enter send-keys -X copy-selection-and-cancel \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'

  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'
  bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'

  bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'
  bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'

  bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'
  bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel \; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi'

  bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-selection-and-cancel ; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi' }
  bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-selection-and-cancel ; run-shell 'if grep -aq SSH_CONNECTION /proc/#{client_pid}/environ 2>/dev/null; then printf "\033]52;c;$(tmux save-buffer - | base64 | tr -d "\n")\a" > #{client_tty}; else tmux save-buffer - | (xclip -in -selection clipboard || xsel -i --clipboard || wl-copy 2>/dev/null); fi' }
}

# --- [BOTH] ---
set -s set-clipboard on
set -g allow-passthrough on

bind-key [ copy-mode
bind-key ] paste-buffer

# Mouse Support
set -g mouse on

# Pane Management
bind-key x kill-pane
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key H command-prompt -p "Join pane from window:"  "join-pane -h -s '%%'"
bind-key V command-prompt -p "Join pane from window:"  "join-pane -v -s '%%'"
bind-key J choose-tree -Zw "join-pane -h -s '%%'"

# Pane Management (no prefix)
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
unbind-key -n M-x
bind -n M-w kill-pane
bind -n M-z resize-pane -Z

# Pane Navigation (Vim-style & Alt-keys)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Switch focus between floating pane and tiled (non-floating) pane
bind -n M-a if-shell -F "#{pane_floating_flag}" "last-pane" \
  "run-shell 'target=$(tmux list-panes -F \"#{pane_id} #{pane_floating_flag}\" | awk \"\$2==1 {print \$1}\"); [ -n \"\$target\" ] && tmux select-pane -t \"\$target\" || tmux last-pane'"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Start windows and panes at 1
# set -g base-index 1
# setw -g pane-base-index 1

# Pane Resizing
bind -r -N "Resize pane left" C-h resize-pane -L 5
bind -r -N "Resize pane down" C-j resize-pane -D 5
bind -r -N "Resize pane up" C-k resize-pane -U 5
bind -r -N "Resize pane right" C-l resize-pane -R 5
bind -n -N "Resize pane left (no prefix)" M-H resize-pane -L 5
bind -n -N "Resize pane down (no prefix)" M-J resize-pane -D 5
bind -n -N "Resize pane up (no prefix)" M-K resize-pane -U 5
bind -n -N "Resize pane right (no prefix)" M-L resize-pane -R 5

bind-key a last-pane
bind-key q display-panes
bind-key C-o rotate-window
bind-key @ break-pane -d

# Window Management
bind-key c new-window
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# Window Management (no prefix)
bind -n M-c new-window -c "#{pane_current_path}"

# Window Navigation
bind-key -n M-n next-window
bind-key -n M-p previous-window
bind-key enter next-layout
bind-key + select-layout even-horizontal
bind-key = select-layout even-vertical
set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80

# Session Management
bind S choose-session
bind N new-session

# Pane Synchronization
bind e setw synchronize-panes

# Utility Bindings
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
bind-key r refresh-client
bind-key L clear-history
bind-key : command-prompt

# Scratchpad (Toggleable bottom pane)
bind-key g split-window -v -p 30 -f

# Floating Scratchpad (Positioned slightly right and higher than center)
bind-key -n M-a    run-shell "~/.tmux/scripts/toggle_floating.sh"                       # Alt + a (Toggle Floating Pane)
bind-key -n M-m    new-pane -f -c "#{pane_current_path}" -X 38% -Y 30%                  # Alt + m (Slightly Right & Higher)
bind-key m         new-pane -f -c "#{pane_current_path}" -X 58% -Y 30%                  # Prefix + m (Slightly Right & Higher)
bind-key -n M-Up   new-pane -f -c "#{pane_current_path}" -x 50% -y 40% -X 50% -Y 0     # Alt + Up (Top-Right)
bind-key -n M-Down new-pane -f -c "#{pane_current_path}" -x 50% -y 40% -X 50% -Y 100%   # Alt + Down (Bottom-Right)
bind-key M         new-pane -f -c "#{pane_current_path}" -x 50% -y 40% -X 50% -Y 0     # Prefix + Shift + m (Top-Right)

# Nested Tmux (Passthrough Mode)
bind -n F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#{@ghostty_bg},bg=#{@ghostty_blue},bold" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# Status Bar
set-option -g status-interval 2
set-option -g status-position bottom
set-option -g status-left " #S   "
set-option -g status-left-length 30
set-option -g status-right "#{?#{==:#{client_key_table},off}, [PASS] ,#{?client_prefix, [PREFIX] ,#{?pane_in_mode, [COPY] ,}}} #(~/.tmux/scripts/agy_monitor.sh) | %H:%M  %d %b"
set-option -g status-right-length 60
setw -g window-status-format        " #I #W "
setw -g window-status-current-style "fg=#{@ghostty_bg},bg=#{@ghostty_blue},bold"
setw -g window-status-current-format " #I #W*#{?window_zoomed_flag,Z,}#{?#{>:#{window_panes},1},[#{window_panes}],} "
setw -g window-status-separator ""

# Local Overrides (source if exists)
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
