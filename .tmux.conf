# ==============================================================================
# 01. PREFIX KEYS & UTILITIES
# ==============================================================================
# Ctrl+b is the tmux prefix.

# Primary Prefix: Ctrl + b
set-option -g prefix C-b
unbind-key C-Space
bind-key -N "Send prefix through to application" C-b send-prefix

# Config & Client Utilities
bind-key -N "Reload tmux configuration" R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."


# ==============================================================================
# 02. GENERAL SETTINGS & TERMINAL FEATURES (tuned for minimum nvim latency)
# ==============================================================================
# Escape-time is the #1 cause of "nvim feels laggy in tmux": tmux waits this
# long after seeing Escape to decide if it's a bare Esc or an Alt/fn-key
# sequence. Default is 500ms. 10ms keeps Alt/M-fn keys working while making
# Esc/insert->normal instant.
set -s escape-time 10
set -sg repeat-time 600
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g renumber-windows on
# Large scrollback costs memory and makes copy-mode search slower. 50k is fine
# on macOS but heavy on a Pi SD-card host, so shrink there (Linux ARM only —
# Apple Silicon is also arm64, so match the OS too).
if-shell 'uname -s | grep -q Linux && uname -m | grep -qE "arm|aarch64"' 'set -g history-limit 20000' 'set -g history-limit 50000'
set -g focus-events on
set -g mouse on
set -s set-clipboard on
set -g allow-passthrough on
# Forward Ghostty/SSH env into new panes/windows so tmux-created shells keep
# semantic-prompt markers and clipboard integration.
set -g update-environment "GHOSTTY_RESOURCES_DIR SSH_TTY SSH_CONNECTION SSH_CLIENT DISPLAY WAYLAND_DISPLAY"
set -g status-interval 5
set-window-option -g display-panes-time 1500
set-option -g assume-paste-time 0

# Terminal Features & Extended Keys
# tmux-256color needs matching terminfo on both ends (present on macOS
# ncurses and Pi libncurses; if a host lacks it, `tmux -V` errors will point
# there). Ghostty speaks RGB + CSI-u extended keys; only advertise extkeys to
# terminals that understand it so old terminfo doesn't misparse C-h/C-i.
set -g default-terminal 'tmux-256color'
if-shell 'tmux -V | grep -qE "tmux (3\.[4-9]|[4-9])"' {
  set -g extended-keys on
  set -g extended-keys-format csi-u
  set -as terminal-features ',xterm-ghostty:RGB:extkeys'
} {
  set -as terminal-features ',xterm-ghostty:RGB'
}
set -as terminal-features ',xterm-256color:RGB'
# Undercurl/underdotted diagnostics (e.g. nvim spell/LSP) over tmux.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'


# ==============================================================================
# 03. ADAPTIVE THEME
# ==============================================================================
# Colour role guide for this tmux configuration:
#
#   colour0   status-bar background; prompt/current-window foreground
#   colour4   prompt/current-window background; active pane border
#   colour7   status-bar foreground
#   colour8   copy-mode selection background; inactive pane border
#   colour15  copy-mode selection foreground; pane and prompt cursor
#
# Other colour numbers are not assigned a tmux UI role here, although programs
# running inside tmux may use them. Ghostty's normal background, foreground,
# cursor and mouse-selection colours are separate theme properties; tmux cannot
# refer to those properties directly. Each colourN gets its RGB value from the
# active terminal theme, so these tmux roles retain their meaning while their
# appearance changes with the Ghostty theme.

set -g cursor-style blinking-bar


# to find ghostty ocnfig colours use: ghostty +show-config

set -g mode-style "bg=#e6edf3,fg=#0d1117"
# set -g cursor-colour "colour15"
# Give prompts (including Prefix+:) the whole status line and hide the normal
# status content behind them, so long commands stay clean and readable.
set -g message-style "bg=colour4,fg=colour0,fill=colour4,width=100%"
set -g status-style "bg=colour0,fg=colour7"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"


# ==============================================================================
# 04. STATUS BAR CONFIGURATION
# ==============================================================================
set-option -g status-left " #h | #S   "
set-option -g status-left-length 30
set-option -g status-right "#{?client_prefix, [PREFIX] ,}#{?pane_in_mode, [COPY] ,} %H:%M  %d %b"
set-option -g status-right-length 40
setw -g monitor-activity on
set-option -g visual-activity off
setw -g window-status-format        " #I #W#{?window_linked,@,}#{?window_activity_flag,+,}#{?window_bell_flag,!,} "
setw -g window-status-current-style "fg=colour0,bg=colour4,bold"
setw -g window-status-current-format " #I #W*#{?window_linked,@,}#{?window_activity_flag,+,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,}#{?#{>:#{window_panes},1},[#{window_panes}],} "
setw -g window-status-separator ""


# ==============================================================================
# 05. COPY MODE & VI BINDINGS
# ==============================================================================

# Key summary:
#   Prefix+[      Enter copy mode (tmux default)
#   F2            Enter copy mode without the prefix
#   v             Begin a selection while in copy mode
#   y             Copy the selection and remain in copy mode
#   Enter         Copy the selection and leave copy mode (tmux default)
#   Escape        Leave copy mode without copying
#   { / }         Jump to the previous / next Zsh prompt
#   Mouse drag    Copy the selection and remain in copy mode

# Use vi navigation in copy mode; keep command-prompt editing emacs-style.
setw -g mode-keys vi
set -g status-keys emacs

# Enter copy mode directly without using the prefix.
bind-key -n -N "Enter copy mode" F2 copy-mode

# -- Navigating between Zsh prompts -------------------------------------------

# Bind { and } while already inside copy mode
bind-key -T copy-mode-vi -N "Jump to previous prompt" "{" send-keys -X previous-prompt
bind-key -T copy-mode-vi -N "Jump to next prompt" "}" send-keys -X next-prompt

# -- Selecting and copying -----------------------------------------------------

# v begins a character-wise selection; Escape cancels copy mode.
bind -T copy-mode-vi -N "Begin selection" v send -X begin-selection
bind -T copy-mode-vi -N "Leave copy mode" Escape send -X cancel

# y copies the selection to the system clipboard and remains in copy mode.
# `copy-pipe` with no argument uses `copy-command` (tmux 3.2+). On older tmux
# (e.g. Pi apt) that flag does nothing, so pass pbcopy explicitly there.
if-shell 'tmux -V | grep -qE "tmux (3\.[2-9]|[4-9])"' {
  bind -T copy-mode-vi -N "Copy to system clipboard" y send -X copy-pipe
} {
  bind -T copy-mode-vi -N "Copy to system clipboard" y send -X copy-pipe-and-cancel "pbcopy"
}

# Finishing a mouse drag also copies while leaving copy mode open.
if-shell 'tmux -V | grep -qE "tmux (3\.[2-9]|[4-9])"' {
  bind -T copy-mode-vi -N "Copy mouse selection to system clipboard" MouseDragEnd1Pane send -X copy-pipe
} {
  bind -T copy-mode-vi -N "Copy mouse selection to system clipboard" MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
}

# Enter copies to the system clipboard and leaves copy mode.
if-shell 'tmux -V | grep -qE "tmux (3\.[2-9]|[4-9])"' {
  bind -T copy-mode-vi -N "Copy to system clipboard and leave" Enter send -X copy-pipe-and-cancel
} {
  bind -T copy-mode-vi -N "Copy to system clipboard and leave" Enter send -X copy-pipe-and-cancel "pbcopy"
}

# -- System clipboard ----------------------------------------------------------

# Set the destination used by every copy-pipe binding above (tmux 3.2+).
if-shell 'uname | grep -q Darwin' {
  # macOS always provides pbcopy.
  set -s copy-command "pbcopy"
} {
  # Raspberry Pi/Linux (headless, no X/Wayland session): emit an OSC 52
  # escape sequence instead of hunting for a GUI clipboard tool. tmux's
  # allow-passthrough relays it out through any nested tmux/ssh hops to
  # Ghostty, which writes it to the real macOS clipboard.
  set -s copy-command 'printf "\033]52;c;%s\a" "$(base64 | tr -d "\n")"'
}

# ==============================================================================
# 06. WINDOW MANAGEMENT & NAVIGATION
# ==============================================================================
bind-key -N "Create window in current directory" c new-window -c "#{pane_current_path}"

# ==============================================================================
# 07. PANE MANAGEMENT, NAVIGATION & JOINING
# ==============================================================================
# Pane Creation & Splitting
bind-key -N "Split pane vertically" '"' split-window -v -c "#{pane_current_path}"
bind-key -N "Split pane horizontally" % split-window -h -c "#{pane_current_path}"
bind-key -N "Kill pane" x kill-pane

# -- Seamless nvim <-> tmux pane movement (smart-splits.nvim) -----------------
# nvim reaches *out* to tmux over the tmux CLI, so it needs no help here. What
# does need help is getting back *in*: C-h in a shell pane must select the nvim
# pane, but C-h inside nvim must reach nvim so it can decide whether to move a
# split or hand off to tmux. So check what the pane is actually running and
# either forward the key or move the pane ourselves.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n -N "Select pane left (nvim aware)"  C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n -N "Select pane down (nvim aware)"  C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n -N "Select pane up (nvim aware)"    C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n -N "Select pane right (nvim aware)" C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Copy mode has no nvim to forward to, so move panes unconditionally.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Pane Navigation
bind -N "Select pane left" h select-pane -L
bind -N "Select pane down" j select-pane -D
bind -N "Select pane up" k select-pane -U
bind -N "Select pane right" l select-pane -R
# bind -n -N "Select pane left" "M-," select-pane -L
# bind -n -N "Select pane right" "M-." select-pane -R
bind-key -n -N "Select previous window" "M-," previous-window
bind-key -n -N "Select next window" "M-." next-window

# Pane Resizing & Zooming
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5
bind-key -n -N "Toggle pane zoom (fullscreen)" F3 resize-pane -Z

bind-key -N "Break pane -d" @ break-pane -d

# Nested Tmux (Passthrough Mode - F12)
# NOTE: `set -u status-style` would restore tmux's compiled default (green),
# not the adaptive colour0/colour7 theme above, so save and restore explicitly.
bind -n -N "Enable nested tmux passthrough" F12 \
  set -g @saved_status_style "#{status-style}" \;\
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=colour0,bg=colour4,bold" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off -N "Disable nested tmux passthrough" F12 \
  set -u prefix \;\
  set -u key-table \;\
  set status-style "#{@saved_status_style}" \;\
  refresh-client -S


# ==============================================================================
# 08. LOCAL OVERRIDES
# ==============================================================================
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
