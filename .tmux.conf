# ==============================================================================
# 01. PREFIX KEYS & UTILITIES
# ==============================================================================
# Ctrl+Space is the tmux prefix.

# Primary Prefix: Ctrl + Space
set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# Config & Client Utilities
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."


# ==============================================================================
# 02. GENERAL SETTINGS & TERMINAL FEATURES
# ==============================================================================
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g mouse on
set -s set-clipboard on
set-window-option -g display-panes-time 1500
set-option -g repeat-time 1000
set-option -g assume-paste-time 0

# Terminal Features & Extended Keys
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:RGB:extkeys'
set -as terminal-features ',xterm-256color:RGB'


# ==============================================================================
# 03. ADAPTIVE THEME
# ==============================================================================
# ANSI colours inherit their values from the active terminal theme.
set -g mode-style "bg=colour4,fg=colour0,bold"
set -g message-style "bg=colour4,fg=colour0"
set -g status-style "bg=colour0,fg=colour7"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"


# ==============================================================================
# 04. STATUS BAR CONFIGURATION
# ==============================================================================
set-option -g status-left " #h | #S   "
set-option -g status-left-length 30
set-option -g status-right "#{?client_prefix, [PREFIX] ,}#{?pane_in_mode, [COPY] ,} %H:%M  %d %b"
set-option -g status-right-length 40
setw -g window-status-format        " #I #W#{?window_linked,@,} "
setw -g window-status-current-style "fg=colour0,bg=colour4,bold"
setw -g window-status-current-format " #I #W*#{?window_linked,@,}#{?window_zoomed_flag,Z,}#{?#{>:#{window_panes},1},[#{window_panes}],} "
setw -g window-status-separator ""


# ==============================================================================
# 05. COPY MODE & VI BINDINGS
# ==============================================================================

# Key summary:
#   Prefix+[      Enter copy mode (tmux default)
#   F2            Enter copy mode without the prefix
#   v             Begin a selection while in copy mode
#   y             Copy the selection and remain in copy mode
#   Enter         Copy the selection and leave copy mode (tmux default)
#   Escape        Leave copy mode without copying
#   { / }         Jump to the previous / next Zsh prompt
#   Mouse drag    Copy the selection and remain in copy mode

# Use vi navigation in copy mode; keep command-prompt editing emacs-style.
setw -g mode-keys vi
set -g status-keys emacs

# Enter copy mode directly without using the prefix.
bind-key -n F2 copy-mode

# -- Navigating between Zsh prompts -------------------------------------------

# Bind { and } while already inside copy mode
bind-key -T copy-mode-vi "{" send-keys -X previous-prompt
bind-key -T copy-mode-vi "}" send-keys -X next-prompt

# -- Selecting and copying -----------------------------------------------------

# v begins a character-wise selection; Escape cancels copy mode.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel

# y copies the selection to the system clipboard and remains in copy mode.
bind -T copy-mode-vi y send -X copy-pipe

# Finishing a mouse drag also copies while leaving copy mode open.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe

# Enter retains tmux's default: copy the selection and leave copy mode.

# -- System clipboard ----------------------------------------------------------

# Set the destination used by every copy-pipe binding above (tmux 3.2+).
if-shell 'uname | grep -q Darwin' {
  # macOS always provides pbcopy.
  set -s copy-command "pbcopy"
} {
  # Raspberry Pi/Linux: use whichever graphical clipboard tool is available.
  # Over SSH, set-clipboard sends copied text to Ghostty using OSC 52.
  set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1; then xsel -i --clipboard; else cat >/dev/null; fi'
}

# ==============================================================================
# 06. WINDOW MANAGEMENT & NAVIGATION
# ==============================================================================
bind-key c new-window -c "#{pane_current_path}"

# ==============================================================================
# 07. PANE MANAGEMENT, NAVIGATION & JOINING
# ==============================================================================
# Pane Creation & Splitting
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key x kill-pane

# Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane Resizing
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

bind-key -N "Break pane -d" @ break-pane -d

# Nested Tmux (Passthrough Mode - F12)
bind -n F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=colour0,bg=colour4,bold" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S


# ==============================================================================
# 08. LOCAL OVERRIDES
# ==============================================================================
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
